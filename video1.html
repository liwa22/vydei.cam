<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Video Fix</title>
</head>

<body style="margin:0;background:black;">

<video id="v" controls autoplay muted playsinline style="width:100%;height:100vh;"></video>

<script>
const videoUrl = "https://cdn.videy.co/video1.mp4"; // ganti punyamu

const v = document.getElementById("v");

// coba cara 1
v.src = videoUrl;

// fallback kalau gagal
v.onerror = () => {
  document.body.innerHTML = `
    <h2 style="color:white;text-align:center">Gagal load video langsung</h2>
    <p style="color:white;text-align:center">
      <a href="${videoUrl}" target="_blank" style="color:cyan">
        Buka video langsung
      </a>
    </p>
  `;
};
</script>

</body>
</html>
