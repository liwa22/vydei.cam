<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIDEO.TWIMG - Premium Video Streaming</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #09090b;
      color: #fafafa;
    }

    header {
      backdrop-filter: blur(12px);
      background-color: rgba(9, 9, 11, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .video-main-container {
      background-color: #000;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #video-player {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Custom Scrollbar untuk List Video */
    .video-sidebar::-webkit-scrollbar {
      width: 6px;
    }
    .video-sidebar::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 10px;
    }

    .video-card {
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .video-card:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .thumbnail-preview {
      aspect-ratio: 16 / 9;
      background-color: #18181b;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .loading-spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="sticky top-0 z-50 px-4 md:px-10 py-4">
    <div class="max-w-[1600px] mx-auto flex justify-between items-center">
      <a href="/" class="flex items-center space-x-2">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
          <i class="fas fa-play text-white text-xs"></i>
        </div>
        <h1 class="text-xl font-bold tracking-tight uppercase">Stream<span class="text-blue-500">Enak</span></h1>
      </a>
      <div class="hidden md:flex flex-1 max-w-md mx-8">
        <div class="relative w-full">
          <input type="text" placeholder="Cari video..." class="w-full bg-zinc-900 border border-zinc-800 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-blue-500">
        </div>
      </div>
      <nav>
        <a href="https://videi.my.id/" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-5 py-2.5 rounded-full font-semibold transition-all">
          <i class="fas fa-cloud-upload-alt mr-2"></i> Upload
        </a>
      </nav>
    </div>
  </header>

  <main class="max-w-[1600px] mx-auto w-full p-4 md:p-6 lg:p-10">
    <div class="flex flex-col lg:flex-row gap-8">
      
      <!-- KOLOM KIRI: PLAYER & DETAIL (65%) -->
      <div class="lg:w-[65%]">
        <div class="video-main-container">
          <div id="loading-spinner" class="absolute inset-0 flex items-center justify-center bg-black z-10">
            <div class="loading-spinner"></div>
          </div>
          <video id="video-player" controls poster="" controlsList="nodownload"></video>
        </div>

        <div class="mt-6">
          <h2 id="video-title" class="text-2xl font-bold mb-2">Memuat...</h2>
          <div class="flex items-center justify-between flex-wrap gap-4 border-b border-zinc-800 pb-6">
            <div class="flex items-center gap-4">
              <div class="flex items-center bg-zinc-800 px-3 py-1.5 rounded-full text-sm">
                <i class="fas fa-eye mr-2 text-zinc-400"></i>
                <span>1.2M Views</span>
              </div>
              <div class="text-sm text-zinc-400">2026</div>
            </div>
            <button id="share-button" class="flex items-center gap-2 bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-full text-sm transition-all">
              <i class="fas fa-share"></i> Bagikan
            </button>
          </div>
          
          <div class="mt-6 bg-zinc-900/50 p-4 rounded-xl">
            <h3 class="font-semibold text-sm mb-2 text-zinc-300 uppercase">Deskripsi</h3>
            <p id="video-description" class="text-zinc-400 text-sm leading-relaxed">Memuat deskripsi...</p>
          </div>
        </div>
      </div>

      <!-- KOLOM KANAN: DAFTAR VIDEO (35%) -->
      <div class="lg:w-[35%]">
        <h3 class="text-lg font-bold mb-4 flex items-center">
          <i class="fas fa-layer-group mr-2 text-blue-500"></i> Video Lainnya
        </h3>
        <div id="video-list" class="space-y-4 video-sidebar overflow-y-auto max-h-[800px] pr-2">
          <!-- Video cards akan muncul di sini via JS -->
        </div>
      </div>

    </div>
  </main>

  <script>
    const JSON_URL = 'https://raw.githubusercontent.com/liwa22/json/refs/heads/main/Video.json';
    const videoPlayer = document.getElementById('video-player');
    const videoTitle = document.getElementById('video-title');
    const videoDescription = document.getElementById('video-description');
    const videoListContainer = document.getElementById('video-list');
    const loadingSpinner = document.getElementById('loading-spinner');

    async function initApp() {
      try {
        const response = await axios.get(JSON_URL);
        const videos = response.data;
        
        // Ambil ID dari URL (Contoh: /e/ID_VIDEO atau /ID_VIDEO)
        let urlPath = window.location.pathname.replace(/^\/|\/$/g, '');
        if (urlPath.startsWith('e/')) urlPath = urlPath.substring(2);
        
        // Jika tidak ada ID di URL, ambil video pertama dari JSON sebagai default
        const currentVideo = videos.find(v => v.id === urlPath) || videos[0];

        if (currentVideo) {
          loadMainVideo(currentVideo);
        }

        renderVideoList(videos, currentVideo.id);

      } catch (error) {
        console.error("Gagal memuat data:", error);
        videoTitle.textContent = "Gagal memuat video.";
      } finally {
        loadingSpinner.style.display = 'none';
      }
    }

    function loadMainVideo(video) {
      videoPlayer.src = video.Url + "#t=1.0";
      videoTitle.textContent = video.Judul || "Untitled Video";
      videoDescription.textContent = video.Description || "Tidak ada deskripsi tersedia.";
      videoPlayer.load();
      // Update Title Browser
      document.title = `${video.Judul} - StreamEnak`;
    }

    function renderVideoList(videos, currentId) {
      videoListContainer.innerHTML = '';

      videos.forEach(video => {
        // Jangan tampilkan video yang sedang diputar di daftar samping (opsional)
        // if (video.id === currentId) return;

        const card = document.createElement('div');
        card.className = 'video-card flex gap-3 p-2 rounded-lg';
        card.innerHTML = `
          <div class="w-40 flex-shrink-0">
            <div class="thumbnail-preview">
              <video class="w-full h-full object-cover" src="${video.Url}#t=2.0" muted></video>
              <div class="absolute bottom-1 right-1 bg-black/80 text-[10px] px-1 rounded text-white font-bold">HD</div>
            </div>
          </div>
          <div class="flex-1">
            <h4 class="text-sm font-semibold line-clamp-2 text-zinc-100">${video.Judul}</h4>
            <p class="text-xs text-zinc-500 mt-1">Official Video</p>
            <p class="text-[11px] text-zinc-600 mt-0.5">1.2M views • 2026</p>
          </div>
        `;

        card.onclick = () => {
          // Navigasi ke video baru (mengubah URL tanpa reload halaman bisa pakai history.pushState)
          // Namun untuk kesederhanaan, kita reload dengan ID baru
          window.location.href = `/${video.id}`;
        };

        videoListContainer.appendChild(card);
      });
    }

    // Share Functionality
    document.getElementById('share-button').onclick = () => {
      navigator.clipboard.writeText(window.location.href);
      alert('Link video disalin ke clipboard!');
    };

    // Matikan klik kanan pada player
    videoPlayer.addEventListener('contextmenu', e => e.preventDefault());

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
