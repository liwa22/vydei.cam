<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Daftar Video</title>
</head>

<body>
<h1>Daftar Video</h1>
<ul id="list"></ul>

<script>
fetch("data.json")
.then(res => res.json())
.then(data => {
  const list = document.getElementById("list");

  data.forEach(item => {
    const li = document.createElement("li");
    li.innerHTML = `<a href="${item.slug}.html">${item.title}</a>`;
    list.appendChild(li);
  });
});
</script>

</body>
</html>
