<head>

  <script type="text/javascript">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #09090b;
      color: #fafafa;
    }

    header {
      backdrop-filter: blur(12px);
      background-color: rgba(9, 9, 11, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    #video-container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background-color: #000;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    #video-player {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      outline: none;
      background-color: #000;
    }

    .loading-spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -25px;
      margin-left: -25px;
      z-index: 20;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .btn-gradient {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      transition: all 0.3s ease;
    }
    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="sticky top-0 z-50 px-6 py-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
   <div class="flex items-center space-x-2">
  <h1 class="text-lg md:text-xl font-bold text-white">
    Download Video Disini
  </h1>
  <i class="fas fa-arrow-right text-blue-500 animate-pulse"></i>
</div>
      <nav>
        <button id="download-button" class="btn-gradient text-white text-sm px-5 py-2.5 rounded-full font-semibold flex items-center">
          <i class="fas fa-download mr-2"></i> Download
        </button>
      </nav>
    </div>
  </header>

  <main class="flex-grow py-8 px-4 md:px-6">
    <div class="max-w-6xl mx-auto">
      <div id="video-container">
        <div class="loading-spinner" id="loading-spinner"></div>
        <video 
          id="video-player" 
          controls 
          preload="auto"
          poster=""
          controlsList="nodownload noremoteplayback" 
          disablePictureInPicture>
          Your browser does not support the video tag.
        </video>
      </div>

      <div id="error-message" class="hidden mt-6 p-4 bg-red-900/20 border border-red-500/50 text-red-400 rounded-xl text-center">
        <i class="fas fa-exclamation-circle mr-2"></i>
        <span id="error-text"></span>
      </div>

      <section class="mt-8">
        <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-6">
          <div class="flex-1">
            <h2 id="video-title" class="text-2xl md:text-3xl font-bold text-white mb-2 leading-tight">Memuat Judul...</h2>
            
            <div class="bg-zinc-900/50 border border-zinc-800 p-4 rounded-2xl">
              <h3 class="text-sm font-semibold text-zinc-300 mb-2 uppercase tracking-wider">Deskripsi</h3>
              <p id="video-description" class="text-zinc-400 leading-relaxed">
                Memuat deskripsi video...
              </p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="border-t border-zinc-900 py-8 px-6 mt-12 text-center">
    <p class="text-zinc-500 text-sm">&copy; 2026 <span class="text-zinc-300 font-semibold">INGAT VIRAL INGAT VYDEI</span>.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      let urlPath = window.location.pathname;
      let videoId = '';
      let currentVideoUrl = '';

      if (urlPath.startsWith('/')) { urlPath = urlPath.substring(1); }
      if (urlPath.startsWith('e/')) { videoId = urlPath.substring(2); } else { videoId = urlPath; }

      const videoPlayer = document.getElementById('video-player');
      const videoTitle = document.getElementById('video-title');
      const videoDescription = document.getElementById('video-description');
      const loadingSpinner = document.getElementById('loading-spinner');
      const errorMessage = document.getElementById('error-message');
      const errorText = document.getElementById('error-text');
      const downloadButton = document.getElementById('download-button');

      if (!videoId) {
        errorText.textContent = 'ID video tidak ditemukan.';
        errorMessage.classList.remove('hidden');
        return;
      }

      loadingSpinner.style.display = 'block';

      try {
        const response = await axios.get('https://raw.githubusercontent.com/liwa22/json/refs/heads/main/Video.json', { timeout: 10000 });
        const videos = response.data;
        const foundVideo = videos.find(video => video.id === videoId);

        if (foundVideo) {
          const videoUrl = foundVideo.Url;
          currentVideoUrl = videoUrl;

          videoPlayer.src = videoUrl + "#t=1.0"; 
          videoTitle.textContent = foundVideo.Judul || 'Untitled Video';
          videoDescription.textContent = foundVideo.Description || 'Tidak ada deskripsi.';
          videoPlayer.load();

          downloadButton.addEventListener('click', () => {
            window.location.href = currentVideoUrl;
          });

        } else {
          errorText.textContent = `Video ID ${videoId} tidak ditemukan.`;
          errorMessage.classList.remove('hidden');
        }
      } catch (error) {
        errorText.textContent = 'Gagal memuat data video.';
        errorMessage.classList.remove('hidden');
      } finally {
        loadingSpinner.style.display = 'none';
      }
    });

    document.addEventListener('contextmenu', event => event.preventDefault());
  </script>
</body>
</html>
